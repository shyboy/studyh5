<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs></defs></svg>
<script src="../lib/engine.js"></script>
<script src="../lib/art.js"></script>
<script>
const { el, show, hide, anim, hook, sfx, S, End, W, prog, ease, clamp, stagger, TL } = E;
const stage = document.getElementById("stage");

/* ---------------------------------------------------------- helpers */
const T0 = (id) => (id === "hook" ? 0 : S(id) - 0.3);
function scene(from, to, cls = "", inType = "fade") {
  const s = el("div", "scene " + cls);
  const t0 = T0(from);
  if (t0 > 0) show(s, t0, inType, 0.45);
  if (to) hide(s, T0(to) + 0.5, "fade", 0.01);
  return s;
}
function abs(cls, html, parent, style = {}) {
  const e = el("div", "abs " + cls, html, parent);
  Object.assign(e.style, style);
  return e;
}
function bubble(text, x, y, parent, right = false) {
  return abs("bubble" + (right ? " r" : ""), text, parent, { left: x + "px", top: y + "px" });
}
/* panel visible while segment `id` plays (until next id starts) */
function panel(parent, id, nextId, type = "right") {
  const p = el("div", "panel", "", parent);
  show(p, S(id) - 0.25, type, 0.5);
  if (nextId) hide(p, S(nextId) - 0.3, "fade", 0.3);
  return p;
}
function markAt(elm, t, dur = 0.5) {
  hook((tt) => elm.style.setProperty("--p", prog(tt, t, dur).toFixed(3)));
}
function shake(elm, t0, t1, amp = 3, freq = 9) {
  hook((t) => {
    const on = t >= t0 && t < t1 ? 1 : 0;
    elm.style.transform = on ? `rotate(${Math.sin(t * freq * 6.283) * amp}deg)` : "";
  });
}
/* all tears fall in a loop */
hook((t) => {
  document.querySelectorAll(".tear").forEach((d, i) => {
    const ph = ((t * 1.5 + (d.classList.contains("t2") ? 0.5 : 0) + i * 0.13) % 1);
    d.style.transform = `translateY(${ph * 70}px)`;
    d.style.opacity = (1 - ph).toFixed(2);
  });
});

/* ================================================================= 1. HOOK */
{
  const s = scene("hook", "ask", "hook-bg");
  const rays = abs("rays", "", s);
  hook((t) => (rays.style.transform = `rotate(${t * 6}deg)`));
  const pill = abs("hook-pill", "情绪爆发期 · 育儿科普", s);
  const l1 = abs("hook-l1", "越哄", s);
  const l2 = abs("hook-l2", "越哭？", s);
  anim(l1, [{ transform: "scale(1.18)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }], 0, 0.35, { ease: "back" });
  anim(l2, [{ transform: "scale(1.18)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }], 0.12, 0.35, { ease: "back" });

/* ================================================================= chapter cards */
function chapter(id, nextId, num, title, color, extra) {
  const s = el("div", "scene chap", "", stage);
  s.style.background = color;
  const t0 = S(id) - 0.45;
  anim(s, [{ clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(75% at 50% 50%)" }], t0, 0.6, { ease: "inOut" });
  hide(s, T0(nextId) + 0.5, "fade", 0.01);
  sfx(t0, "whoosh", 0.9);
  const big = abs("big", num, s);
  show(big, t0 + 0.2, "zoom", 0.8);
  show(abs("step", "第" + "一二三四"[+num - 1] + "步", s), t0 + 0.3, "left", 0.5);
  show(abs("title", title, s), t0 + 0.45, "up", 0.6);
  if (extra) extra(s, t0);
  return s;
}

/* ================================================================= persistent top bar */
const CH = [
  ["c1", "c2", "为什么一点小事就崩溃"],
  ["c2", "c3", "为什么越哄越糟"],
  ["c3", "c4", "崩溃当下：稳 · 陪 · 守"],
  ["c4", "end1", "平时：减少崩溃燃料"],
];
function topbar() {
  const bar = el("div", "topbar", "", stage);
  const tag = abs("chapter-tag", "<b>1</b><span></span>", bar);
  const prog4 = abs("progress", CH.map(() => "<i><s></s></i>").join(""), bar);
  const fills = prog4.querySelectorAll("s");
  hook((t) => {
    let k = -1;
    CH.forEach(([a], i) => { if (t >= S(a) + 0.6) k = i; });
    const inCard = CH.some(([a]) => t >= S(a) - 0.45 && t < End(a) + 0.5);
    const vis = k >= 0 && t < T0("end1") && !inCard;
    bar.style.opacity = vis ? 1 : 0;
    if (k >= 0) {
      tag.querySelector("b").textContent = k + 1;
      tag.querySelector("span").textContent = CH[k][2];
      tag.querySelector("b").style.background = ["#6C9CF0", "#F2836B", "#4FB3A6", "#E9A93B"][k];
    }
    fills.forEach((f, i) => {
      const [a, b] = CH[i];
      f.style.transform = `scaleX(${clamp((t - S(a)) / (S(b) - S(a))).toFixed(3)})`;
      f.style.background = ["#6C9CF0", "#F2836B", "#4FB3A6", "#E9A93B"][i];
    });
  });
}

    sfx(tk, "blip", 0.5);
    const kid = abs("", ART.kid("sleepy"), p, { left: "1010px", top: "520px", width: "180px" });
    show(kid, W("p1", "累过头了") - 0.3, "pop", 0.4);
    const list = abs("col", "", p, { left: "560px", top: "200px", gap: "26px" });
    [["🌙", "入睡时间提前半小时", "提前半小时"], ["💡", "睡前 1 小时调暗灯光", "调暗灯光"], ["🎮", "少玩刺激的游戏", "刺激的游戏"]].forEach(([e, txt, w]) => {
      const c = el("div", "chip", `<span style="font-size:50px">${e}</span>${txt}`, list);
      c.style.fontSize = "46px";
      show(c, W("p1", w) - 0.15, "right", 0.4);
      sfx(W("p1", w), "pop", 0.5);
    });
    const cap = abs("pcap", "<span>睡前为姿势大哭，常常是累过头了</span>", p);
    show(cap, W("p1", "比如睡觉时") - 0.1, "up", 0.4);
  }
  // p2
  {
    const p = panel(s, "p2", "p3");
    abs("ptitle", "第二 · 转换之前先预告", p);
    const tm = abs("", `<svg viewBox="0 0 360 360" width="360"><circle cx="180" cy="180" r="150" fill="#fff" stroke="#EEE7F3" stroke-width="26"/>
      <circle class="arc" cx="180" cy="180" r="150" fill="none" stroke="#E9A93B" stroke-width="26" stroke-linecap="round" transform="rotate(-90 180 180)"/>
      <text class="num" x="180" y="205" text-anchor="middle" font-size="84" font-weight="900" fill="#3A3550">5:00</text></svg>`, p, { left: "100px", top: "170px" });
    const arc = tm.querySelector(".arc"), num = tm.querySelector(".num");
    const C = 2 * Math.PI * 150;
    arc.style.strokeDasharray = C;
    const t5 = W("p2", "再玩五分钟");
    show(tm, t5 - 0.2, "pop", 0.4);
    hook((t) => {
      const left = 300 - Math.floor(clamp(t - t5, 0, 99) * 1);
      num.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      arc.style.strokeDashoffset = (C * (1 - left / 300)).toFixed(1);
    });
    sfx(t5, "tick", 0.6);
    const b = abs("bubble", "再玩 5 分钟，我们就去洗澡～", p, { left: "540px", top: "220px", fontSize: "50px", fontFamily: "var(--hand)" });
    show(b, t5, "pop", 0.4, "back");
    const c2 = abs("chip", "🧠 给大脑留一点准备时间", p, { left: "540px", top: "420px", fontSize: "44px" });
    show(c2, W("p2", "准备时间") - 0.4, "up", 0.4);
    const cap = abs("pcap", "<span>少一次“突然袭击”，就少一次崩溃</span>", p);
    show(cap, W("p2", "突然袭击") - 0.2, "up", 0.4);
  }
  // p3
  {
    const p = panel(s, "p3", "p4");
    abs("ptitle", "第三 · 给她一点选择权", p);
    const sock = (c) => `<svg viewBox="0 0 160 240" width="200"><path d="M40 10 h80 v120 q0 30 -30 50 l-40 30 q-40 20 -50 -20 q-6 -24 20 -40 l20 -16z" fill="${c}"/><rect x="36" y="6" width="88" height="34" rx="10" fill="#fff" opacity=".6"/></svg>`;
    const kid = abs("", ART.kid("happy"), p, { left: "460px", top: "260px", width: "300px" });
    const r = abs("", sock("#E5484D"), p, { left: "150px", top: "220px" });
    const bl = abs("", sock("#6C9CF0"), p, { left: "880px", top: "220px" });
    show(r, W("p3", "红袜子") - 0.15, "pop", 0.4, "back");
    show(bl, W("p3", "蓝袜子") - 0.15, "pop", 0.4, "back");
    show(kid, W("p3", "红袜子") - 0.3, "up", 0.4);
    sfx(W("p3", "红袜子"), "pop", 0.6);
    sfx(W("p3", "蓝袜子"), "pop", 0.6);
    const b = abs("bubble", "你想穿哪一双？", p, { left: "420px", top: "130px", fontSize: "50px", fontFamily: "var(--hand)" });
    show(b, W("p3", "你想穿") - 0.1, "pop", 0.4);
    const cap = abs("pcap", "<span>有了掌控感，对抗就会少很多</span>", p);
    show(cap, W("p3", "掌控感") - 0.2, "up", 0.4);
    sfx(W("p3", "掌控感"), "ding", 0.5);
  }
  // p4
  {
    const p = panel(s, "p4", "bed");
    abs("ptitle", "第四 · 每天 15 分钟专属陪伴", p);
    const tank = abs("", `<div style="width:260px;height:440px;border:12px solid #3A3550;border-radius:40px;position:relative;overflow:hidden;background:#fff">
      <div class="lq" style="position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(#FF9B8A,#F2836B);transform-origin:bottom"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px">💗</div></div>
      <div style="font-size:42px;font-weight:900;text-align:center;margin-top:16px">情绪账户</div>`, p, { left: "120px", top: "150px", width: "260px" });
    const lq = tank.querySelector(".lq");
    const tf = W("p4", "存满了");
    show(tank, S("p4") + 0.2, "up", 0.45);
    hook((t) => (lq.style.transform = `scaleY(${(0.15 + 0.85 * prog(t, S("p4") + 1, tf - S("p4"), ease.inOut)).toFixed(3)})`));
    sfx(tf, "levelup", 0.5);
    const list = abs("col", "", p, { left: "520px", top: "220px", gap: "26px" });
    [["⏱️", "每天 15 分钟，只属于她", "十五分钟"], ["📵", "放下手机", "放下手机"], ["🧸", "跟着她玩，她说了算", "跟着她玩"]].forEach(([e, txt, w]) => {
      const c = el("div", "chip", `<span style="font-size:50px">${e}</span>${txt}`, list);
      c.style.fontSize = "46px";
      show(c, W("p4", w) - 0.15, "right", 0.4);
      sfx(W("p4", w), "pop", 0.5);
    });
    const cap = abs("pcap", "<span>存满了，就不用靠大哭换关注</span>", p);
    show(cap, W("p4", "不需要") - 0.2, "up", 0.4);
  }
}

/* ---- bedtime */
{
  const s = scene("bed", "doctor", "night");
  for (let i = 0; i < 40; i++) {
    const st = abs("star", "", s, { left: (i * 397) % 1900 + "px", top: (i * 151) % 520 + 20 + "px" });
    const ph = i * 0.7;
    hook((t) => (st.style.opacity = (0.35 + 0.65 * Math.abs(Math.sin(t * 0.9 + ph))).toFixed(2)));
  }
  abs("moon", "", s);
  const kid = abs("", ART.kid("sad", "#B9A5E8"), s, { left: "180px", top: "150px", width: "330px" });
  show(kid, S("bed"), "up", 0.5);
  const title = abs("", "睡前哭：不争对错，先接住", s, { left: "640px", top: "110px", fontFamily: "var(--fun)", fontSize: "60px", color: "#FFE7A0" });
  show(title, S("bed") + 0.2, "down", 0.4);
  const nb = abs("nbubble", "嗯，不舒服，我们慢慢调。", s, { top: "220px" });
  show(nb, W("bed", "嗯") - 0.1, "pop", 0.45, "back");
  sfx(W("bed", "嗯"), "ding", 0.5);
  const chips = abs("row", "", s, { left: "660px", top: "420px", gap: "26px" });
  [["🔉", "声音放低", "声音放低"], ["🐢", "动作放慢", "动作放慢"]].forEach(([e, txt, w]) => {
    const c = el("div", "chip", `<span style="font-size:46px">${e}</span>${txt}`, chips);
    c.style.color = "var(--ink)";
    show(c, W("bed", w) - 0.1, "up", 0.4);
  });
  const rt = abs("routine", "", s);
  const R = [["🛁", "洗澡"], ["🪥", "刷牙"], ["📖", "讲故事"], ["💡", "关灯"], ["🤲", "拍一拍"]];
  R.forEach(([e, txt], i) => {
    if (i) {
      const a = el("div", "rarrow", "›", rt);
      show(a, W("bed", txt) - 0.2, "fade", 0.3);
    }
    const c = el("div", "rstep", `<span class="e">${e}</span>${txt}`, rt);
    show(c, W("bed", txt) - 0.12, "pop", 0.4, "back");
    sfx(W("bed", txt), "pop", 0.5);
  });
  const fin = abs("", "每天一样 = 大脑的安全感", s, { left: "0", right: "0", top: "860px", textAlign: "center", fontFamily: "var(--hand)", fontSize: "54px", color: "#FFE7A0" });
  show(fin, W("bed", "每天一样") - 0.1, "up", 0.45);
  sfx(W("bed", "安全感"), "ding", 0.5);
  // bring kid to sleepy when routine done
  const kid2 = abs("", ART.kid("sleepy", "#B9A5E8"), s, { left: "180px", top: "150px", width: "330px" });
  show(kid2, W("bed", "拍一拍"), "fade", 0.6);
}

/* ---- doctor */
{
  const s = scene("doctor", "end1", "dots");
  const card = abs("doc-card card", `<h2>🩺 出现这些情况，建议咨询医生</h2><div class="where">儿童保健科 / 发育行为儿科</div>`, s);
  show(card, S("doctor"), "up", 0.5);
  [["几乎每天都要崩溃好几次", "几乎每天"], ["一次哭闹经常超过 25 分钟", "超过25分钟"], ["会伤害自己，或攻击别人", "伤害自己"], ["5 岁以后依然很频繁，影响睡眠和上学", "五岁以后"]].forEach(([txt, w], i) => {
    const d = el("div", "ditem", `<span class="n">${i + 1}</span>${txt}`, card);
    show(d, W("doctor", w) - 0.15, "right", 0.4);
    sfx(W("doctor", w), "tap", 0.8);
  });
  show(abs("disclaimer", "本视频为育儿科普，不能替代医生的专业评估", s), S("doctor") + 0.4, "fade", 0.5);
}

/* ---- ending 1 */
{
  const s = scene("end1", "end2", "sunset");
  const hug = abs("", "", s, { left: "110px", top: "220px", width: "720px", height: "640px" });
  abs("", ART.mom("calm"), hug, { left: "30px", top: "20px", width: "400px" });
  abs("", ART.kid("calm"), hug, { left: "320px", top: "200px", width: "340px" });
  const hearts = [];
  for (let i = 0; i < 6; i++) hearts.push(abs("", ART.heart(["#F2836B", "#FF9B8A", "#FFC857"][i % 3]), s, { left: 200 + i * 110 + "px", top: "800px", width: 50 + (i % 3) * 14 + "px" }));
  hook((t) => hearts.forEach((h, i) => {
    const ph = ((t - S("end1")) * 0.18 + i * 0.17) % 1;
    h.style.transform = `translate(${Math.sin(t + i) * 30}px, ${-ph * 700}px)`;
    h.style.opacity = t < S("end1") ? 0 : (Math.sin(ph * Math.PI) * 0.9).toFixed(2);
  }));
  show(hug, S("end1"), "up", 0.6);
  const tx = abs("endtext", "", s);
  [
    ["你读过的每一本绘本，", "每一本绘本"],
    ["每一次安抚，", "每一次安抚"],
    ["都<b>没有白费</b>。", "都没有白费"],
    ["孩子学会管理情绪，", "孩子学会"],
    ["靠的不是一次说教，", "靠的不是"],
    ["而是一次又一次，", "而是一次又一次"],
    ["被你<b>稳稳地接住</b>。", "被你稳稳地接住"],
  ].forEach(([ln, w]) => {
    const l = el("span", "ln", ln, tx);
    show(l, W("end1", w) - 0.15, "blur", 0.6);
  });
}

/* ---- ending 2 */
{
  const s = scene("end2", null, "sunset");
  const sum = abs("sum", "崩溃会过去，<span style='color:#D9614A'>爱会留下</span>", s);
  show(sum, S("end2"), "blur", 0.7);
  const row = abs("sumrow", "", s);
  [["稳", "#4FB3A6", "先稳住自己"], ["陪", "#F2836B", "少说多陪伴"], ["守", "#6C9CF0", "守住界限"]].forEach(([c, col, d]) => {
    const card = el("div", "sumcard card", `<div class="c" style="background:${col}">${c}</div><div class="d">${d}</div>`, row);
    const t = W("end2", c);
    show(card, t - 0.1, "pop", 0.45, "back");
    sfx(t, "coin", 0.7);
  });
  const cta = abs("cta", "<span>转给身边同样在熬的爸爸妈妈 ❤</span>", s);
  show(cta, W("end2", "觉得有用") - 0.1, "up", 0.5);
  hook((t) => (cta.firstElementChild.style.transform = t > W("end2", "转给") ? `scale(${(1 + 0.03 * Math.sin(t * 5)).toFixed(3)})` : ""));
  const refs = abs("refs", "参考：Siegel & Bryson《全脑教养法》；美国儿科学会 HealthyChildren.org「Temper Tantrums」；Belden et al., J Pediatr 2008", s);
  show(refs, W("end2", "觉得有用"), "fade", 0.6);
}

topbar();
</script>
