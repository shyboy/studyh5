<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../lib/base.css">
<link rel="stylesheet" href="style.css">
<style>
  html, body, #stage { width: var(--w); height: 1080px; }
  #stage.hook-bg { background: radial-gradient(120% 120% at 70% 40%, #ff8a5c 0%, #ff6b4a 45%, #e5412b 100%); }
  .hb .in { font-size: 54px; }
  .tagline { position: absolute; left: 90px; top: 770px; display: flex; gap: 22px; }
  .tagline .pill { font-size: 50px; border: 5px solid var(--ink); }
</style>
</head>
<body>
<div id="stage" class="hook-bg"><div class="rays"></div></div>
<script>
  const w = +(new URLSearchParams(location.search).get("w") || 1920);
  document.documentElement.style.setProperty("--w", w + "px");
  const narrow = w < 1700;
  const st = document.getElementById("stage");
  const add = (html, css) => { const d = document.createElement("div"); d.className = "abs"; d.style.cssText = css; d.innerHTML = html; st.appendChild(d); return d; };
  const kx = narrow ? 980 : 1300;
  add(`<span class="emo" style="font-size:${narrow ? 360 : 420}px">🧒</span>`, `left:${kx}px;top:${narrow ? 300 : 230}px`);
  add(`<span class="emo" style="font-size:150px">🧸</span>`, `left:${kx + (narrow ? 300 : 350)}px;top:${narrow ? 520 : 500}px`);
  add(`<div class="loadbar" style="width:${narrow ? 400 : 480}px"><div class="lb-t">穿鞋进度 <span>3%</span></div><div class="track"><div class="fill"></div></div></div>`, `left:${kx + 10}px;top:${narrow ? 730 : 720}px`);
  const bub = narrow
    ? [[960, 90, -6, "快点！"], [1150, 210, 5, "快穿鞋！"]]
    : [[1010, 90, -6, "快点！"], [1560, 110, 5, "快穿鞋！"], [1120, 560, -8, "快快快！"]];
  bub.forEach(([x, y, r, t]) => add(`<div class="hb" style="position:relative;transform:rotate(${r}deg)"><div class="in">${t}</div></div>`, `left:${x}px;top:${y}px;z-index:3`));
  add(`<div class="pill pill-sun" style="font-size:42px;border:4px solid var(--ink);padding:6px 26px"><span class="emo">🧒</span> 4–6岁家长必看</div>`, "left:90px;top:120px");
  add(`<div class="hl1" style="font-size:${narrow ? 118 : 132}px">每天催<span class="n" style="font-size:${narrow ? 180 : 200}px">100</span>遍</div><div class="hl2" style="font-size:${narrow ? 190 : 212}px;margin-top:24px;transform:rotate(-2deg)">越催越慢？</div>`, "left:84px;top:210px;z-index:2");
  add(`<div class="tagline"><div class="pill pill-white">6 个方法</div><div class="pill pill-ink" style="border-color:#fff">让孩子自己动起来</div></div>`, "left:0;top:0;width:100%;height:100%");
</script>
</body>
</html>
